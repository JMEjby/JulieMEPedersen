<script>
  fetch('data/research.md')
    .then(r => r.text())
    .then(text => {
      const container = document.getElementById('research-content');
      container.innerHTML = marked.parse(text);
      container.querySelectorAll('a[href^="http"]').forEach(a => {
        a.target = '_blank';
        a.rel = 'noopener';
      });
    });
</script>
