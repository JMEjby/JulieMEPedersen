<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Publications · Julie M. E. Pedersen</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header>
  <nav>
    <span class="nav-name">Julie M. E. Pedersen</span>
    <ul class="nav-links">
      <li><a href="index.html">About</a></li>
      <li><a href="research.html">Research</a></li>
      <li><a href="publications.html" class="active">Publications</a></li>
      <li><a href="cv.pdf">CV</a></li>
    </ul>
  </nav>
</header>

<main>

  <h2>Publications</h2>
  <ul class="pub-list" id="publications-list">
    <li class="pub-item" style="color: var(--text-light, #888)">Loading…</li>
  </ul>

  <h2>Other Writing</h2>
  <ul class="pub-list" id="writing-list">
    <li class="pub-item" style="color: var(--text-light, #888)">Loading…</li>
  </ul>

</main>

<footer>
  <p>Julie M. E. Pedersen &nbsp;·&nbsp; University of Edinburgh &nbsp;·&nbsp; <a href="mailto:j.pedersen@ed.ac.uk">j.pedersen@ed.ac.uk</a></p>
</footer>

<script>
  function renderPubItem(item) {
    const links = item.links && item.links.length
      ? `<div class="pub-links">${item.links.map(l =>
          `<a class="pub-link" href="${l.url}" target="_blank" rel="noopener">${l.label}</a>`
        ).join('')}</div>`
      : '';
    return `
      <li class="pub-item">
        <span class="pub-title">${item.title}</span>
        <p class="pub-meta">${item.authors} &nbsp;·&nbsp; <em>${item.venue}</em>, ${item.year}</p>
        ${links}
      </li>`;
  }

  async function loadList(jsonPath, listId) {
    try {
      const res = await fetch(jsonPath);
      if (!res.ok) throw new Error(res.status);
      const items = await res.json();
      document.getElementById(listId).innerHTML = items.map(renderPubItem).join('');
    } catch (e) {
      document.getElementById(listId).innerHTML =
        '<li class="pub-item" style="color:#c00">Could not load data. If you are viewing this file directly in a browser (not via a server), open it with a local server instead.</li>';
    }
  }

  loadList('data/publications.json', 'publications-list');
  loadList('data/writing.json', 'writing-list');
</script>

</body>
</html>
