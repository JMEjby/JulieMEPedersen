<script>
  async function loadRecentPubs() {
    try {
      const res = await fetch('data/publications.json');
      if (!res.ok) throw new Error();
      const pubs = await res.json();
      const recent = pubs.slice(0, 3);
      document.getElementById('recent-pubs').innerHTML = recent.map(p => {
        const url = p.links && p.links.length ? p.links[0].url : null;
        const title = url
          ? `<a href="${url}" target="_blank" rel="noopener">${p.title}</a>`
          : p.title;
        return `
        <li class="pub-item">
          <span class="pub-title">${title}</span>
          <p class="pub-meta">${p.authors} (${p.year}). <em>${p.venue}</em>.</p>
        </li>`;
      }).join('');
    } catch (e) {
      document.getElementById('recent-pubs').innerHTML = '';
    }
  }

  async function loadConferences() {
    try {
      const res = await fetch('data/conferences.json');
      if (!res.ok) throw new Error();
      const conferences = await res.json();
      document.getElementById('conferences-list').innerHTML = conferences.map(c => {
        let presentation = '';
        if (c.presentation_type || c.talk_title) {
          const parts = [];
          parts.push([c.presentation_type, c.talk_title ? `<em>${c.talk_title}</em>` : ''].filter(Boolean).join(': '));
          if (c.session_title) parts.push(`In the ${c.session_title} session`);
          const bothTBD = c.talk_date === 'TBD' && c.talk_time === 'TBD';
          const dateTime = bothTBD ? 'TBD' : [c.talk_date, c.talk_time].filter(Boolean).join(', ');
          if (dateTime) parts.push(`@${dateTime}`);
          presentation = parts.join(' &nbsp;·&nbsp; ');
        }
        return `
        <li class="pub-item">
          <span class="pub-title">${c.url
            ? `<a href="${c.url}" target="_blank" rel="noopener">${c.name}</a>`
            : c.name}</span>
          <p class="pub-meta">${c.location} &nbsp;·&nbsp; ${c.dates}</p>
          ${presentation ? `<p class="pub-meta">${presentation}</p>` : ''}
        </li>`;

      }).join('');
    } catch (e) {
      document.getElementById('conferences-list').innerHTML = '';
    }
  }

  async function loadMarkdown(mdPath, containerId) {
    try {
      const res = await fetch(mdPath);
      if (!res.ok) throw new Error();
      const text = await res.text();
      const container = document.getElementById(containerId);
      container.innerHTML = marked.parse(text);
      container.querySelectorAll('a[href^="http"]').forEach(a => {
        a.target = '_blank';
        a.rel = 'noopener';
      });
    } catch (e) {}
  }

  loadRecentPubs();
  loadConferences();
  loadMarkdown('data/about.md', 'about-text');
</script>
